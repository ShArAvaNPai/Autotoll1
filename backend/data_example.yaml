# AutoToll AI - Dataset Configuration Example
# Save this file as 'data.yaml' in your dataset directory

# Path to the dataset root directory (can be absolute or relative)
path: /absolute/path/to/your/dataset 

# Directories relative to 'path' above
train: images/train  # train images (relative to 'path') 
val: images/val      # val images (relative to 'path')

# Classes
names:
  0: Car
  1: Motorcycle
  2: Bus
  3: Truck
  4: Emergency Vehicle
